<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAREA 4</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-900 p-6 flex flex-col gap-4">
    
    <div class="border-white border-2 h-20 flex items-center px-4 text-white font-bold">
        a
    </div>
    <div class="border-white border-2 h-20"></div>
    <div class="border-white border-2 h-20 flex items-center px-4 text-white font-bold">
        c
    </div>

    <!--+++++++++++++++-->
    <div class="border-black border-4 p-6">
        <div class="grid grid-cols-3 gap-8 justify-items-center">
            
            <!-- 1. Blur (Redonda) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 rounded-full w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/1.jpg" alt="" class="w-full h-full object-cover rounded-full blur-sm">
                </div>
                <span class="text-white mt-2 font-medium">blur</span>
            </div>

            <!-- 2. Transparente (Cuadrada) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/2.jpg" alt="" class="w-full h-full object-cover opacity-50">
                </div>
                <span class="text-white mt-2 font-medium">transparente</span>
            </div>

            <!-- 3. Escala de grises (Redonda) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 rounded-full w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/3.webp" alt="" class="w-full h-full object-cover rounded-full grayscale">
                </div>
                <span class="text-white mt-2 font-medium">escala de grises</span>
            </div>

            <!-- 4. Intensidad (Cuadrada - Con saturación y contraste bien visibles) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/4.jpg" alt="" class="w-full h-full object-cover saturate-200 contrast-125">
                </div>
                <span class="text-white mt-2 font-medium">intensidad</span>
            </div>

            <!-- 5. Opacidad (Redonda) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 rounded-full w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/5.jpg" alt="" class="w-full h-full object-cover rounded-full opacity-20">
                </div>
                <span class="text-white mt-2 font-medium">opacidad</span>
            </div>

            <!-- 6. Libre (saturacion) (Cuadrada) -->
            <div class="flex flex-col items-center">
                <div class="bg-lime-400 w-32 h-32 overflow-hidden flex items-center justify-center">
                    <img src="img/6.jpeg" alt="" class="w-full h-full object-cover saturate-[3]">
                </div>
                <span class="text-white mt-2 font-medium">libre(saturacion)</span>
            </div>

        </div>
    </div>
    <!--+++++++++++++++-->

    <div class="border-green-950 border-4 h-20 flex items-center px-4">
        <h2 class="text-white">Diseñado por: Javier Rodrigo Mayta Bitre</h2>
    </div>

</body>
</html>
